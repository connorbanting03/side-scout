# NOTE: This service is now deployed from the project root.
# See /nixpacks.toml for the full build + start configuration.
# This file is kept for reference only.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn -w 4 --threads 4 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - api:app"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
