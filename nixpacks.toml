# Railway / Nixpacks build configuration
# Installs both Node.js (frontend) and Python (backend) dependencies,
# builds the Next.js static export, then starts Gunicorn to serve everything.

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "npm"]

[phases.install]
cmds = [
  "npm ci",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "cd backend && gunicorn -w 2 --threads 2 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - api:app"
